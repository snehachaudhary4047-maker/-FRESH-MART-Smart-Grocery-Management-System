<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}FreshMart{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>

<style>
  :root {
    --green-dark: #14532d;
    --green: #16a34a;
    --green-mid: #15803d;
    --green-light: #22c55e;
    --green-bright: #4ade80;
    --green-soft: #dcfce7;
    --mint: #bbf7d0;
    --dark: #1f2937;
    --muted: #6b7280;
    --white: #ffffff;
    --radius: 18px;
    --transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
    --sidebar-width: 270px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    color: var(--dark);
    min-height: 100vh;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 10% 15%, rgba(34,197,94,0.08), transparent 25%),
      radial-gradient(circle at 85% 20%, rgba(74,222,128,0.08), transparent 22%),
      radial-gradient(circle at 80% 80%, rgba(22,163,74,0.08), transparent 25%),
      linear-gradient(135deg, #f0fdf4 0%, #dcfce7 50%, #ecfdf5 100%);
  }

  h1, h2, h3, h4, h5 {
    font-family: 'Syne', sans-serif;
  }


  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: var(--sidebar-width);
    height: 100vh;
    z-index: 1000;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    background: linear-gradient(
      180deg,
      #14532d,
      #166534,
      #15803d
    );
    box-shadow: 8px 0 24px rgba(0,0,0,0.12);
    overflow-y: auto;
    border-right: 1px solid rgba(255,255,255,0.12);
  }

  .nav-brand {
    font-family: 'Syne', sans-serif;
    font-size: 26px;
    font-weight: 800;
    color: #fff;
    text-decoration: none;
    letter-spacing: -0.6px;
    padding: 8px 10px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    margin-bottom: 8px;
    display: block;
  }

  .nav-brand span {
    color: var(--green-bright);
  }

  .nav-user {
    display: flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.9);
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 14px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.10);
    margin-bottom: 8px;
  }

  .nav-links {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .nav-links a {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: rgba(255,255,255,0.9);
    font-size: 14px;
    font-weight: 600;
    padding: 12px 14px;
    border-radius: 14px;
    transition: var(--transition);
    background: rgba(255,255,255,0.05);
    border: 1px solid transparent;
  }

  .nav-links a:hover,
  .nav-links a.active {
    background: rgba(255,255,255,0.14);
    color: #fff;
    transform: translateX(4px);
    border-color: rgba(255,255,255,0.18);
    box-shadow: 0 8px 18px rgba(0,0,0,0.10);
  }

  .nav-links .btn-logout:hover {
    background: rgba(239,68,68,0.18);
    border-color: rgba(239,68,68,0.22);
  }


  .main-content {
    margin-left: var(--sidebar-width);
    min-height: 100vh;
    padding: 32px 24px 48px;
    position: relative;
    z-index: 2;
  }
  .page-title {
    font-size: 30px;
    font-weight: 800;
    color: var(--green-dark);
    margin-bottom: 8px;
    line-height: 1.15;
  }

  .page-sub {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 26px;
    line-height: 1.65;
  }

  /* =========================
     CARD
  ========================= */
  .card {
    border: 1px solid rgba(34,197,94,0.14);
    border-radius: var(--radius);
    background: rgba(255,255,255,0.88);
    box-shadow: 0 10px 28px rgba(22,163,74,0.08);
    overflow: hidden;
    transition: var(--transition);
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 34px rgba(22,163,74,0.12);
  }

  .card-header-green {
    background: linear-gradient(135deg, #16a34a, #15803d);
    color: #fff;
    padding: 18px 22px;
    font-weight: 700;
    border-radius: var(--radius) var(--radius) 0 0 !important;
  }

  .btn-green {
    background: linear-gradient(135deg, var(--green), var(--green-mid));
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 11px 22px;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    display: inline-block;
    transition: var(--transition);
  }

  .btn-green:hover {
    background: linear-gradient(135deg, var(--green-light), var(--green));
    color: #fff;
    transform: translateY(-2px);
  }

  .btn-outline-green {
    border: 1.5px solid rgba(22,163,74,0.22);
    color: var(--green-mid);
    border-radius: 12px;
    padding: 10px 18px;
    background: rgba(255,255,255,0.8);
    text-decoration: none;
    display: inline-block;
    font-size: 14px;
    font-weight: 600;
    transition: var(--transition);
  }

  .btn-outline-green:hover {
    background: rgba(34,197,94,0.10);
    color: var(--green-dark);
  }
  label {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    color: var(--green-dark);
    margin-bottom: 7px;
  }

  .form-control,
  .form-select {
    width: 100%;
    border: 1.5px solid rgba(22,163,74,0.14);
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 14px;
    background: #fff;
    color: #1f2937;
    outline: none;
    transition: var(--transition);
  }

  .form-control::placeholder {
    color: #9ca3af;
  }

  .form-control:focus,
  .form-select:focus {
    border-color: var(--green);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(34,197,94,0.12);
  }

  .table {
    width: 100%;
    color: #1f2937;
    background: #fff;
  }

  .table thead tr {
    background: #dcfce7;
  }

  .table th {
    font-weight: 800;
    color: var(--green-dark);
    font-size: 11px;
    text-transform: uppercase;
    padding: 14px 16px;
    border-bottom: 1px solid rgba(22,163,74,0.12);
  }

  .table td {
    padding: 14px 16px;
    border-bottom: 1px solid rgba(22,163,74,0.08);
  }

  .table tbody tr:hover {
    background: rgba(34,197,94,0.06);
  }

  @media (max-width: 992px) {
    .sidebar {
      width: 220px;
    }

    .main-content {
      margin-left: 220px;
    }
  }

  @media (max-width: 768px) {
    .sidebar {
      position: relative;
      width: 100%;
      height: auto;
      border-right: none;
      border-bottom: 1px solid rgba(22,163,74,0.12);
    }

    .main-content {
      margin-left: 0;
      padding: 20px 16px 32px;
    }

    .nav-links {
      flex-direction: row;
      flex-wrap: wrap;
    }

    .nav-links a {
      flex: 1 1 calc(50% - 8px);
      justify-content: center;
    }
  }

  @media (max-width: 576px) {
    .nav-links a {
      flex: 1 1 100%;
    }

    .page-title {
      font-size: 22px;
    }
  }

  /* Scrollbar */
  ::-webkit-scrollbar {
    width: 10px;
  }

  ::-webkit-scrollbar-track {
    background: #dcfce7;
  }

  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--green-light), var(--green));
    border-radius: 999px;
  }
</style>
</head>
<body>

{% if request.user.is_authenticated %}
<nav class="sidebar">
  <a class="nav-brand" href="{% url 'store:home' %}">Fresh<span>Mart</span></a>

  <div class="nav-user">
    <i class="bi bi-person-circle"></i> {{ request.user.username }}
  </div>

  <div class="nav-links">
    <a href="{% url 'store:home' %}"><i class="bi bi-house"></i> Home</a>
    <a href="{% url 'store:category_add' %}"><i class="bi bi-tag"></i> Category</a>
    <a href="{% url 'store:product_add' %}"><i class="bi bi-box"></i> Product</a>
    <a href="{% url 'store:variant_add' %}"><i class="bi bi-layers"></i> Variant</a>
    <a href="{% url 'store:customer_list' %}"><i class="bi bi-people"></i> Customers</a>
    <a href="{% url 'store:bill_create' %}"><i class="bi bi-receipt"></i> New Bill</a>
    <a href="{% url 'store:sales_list' %}"><i class="bi bi-graph-up"></i> Sales</a>
    <a href="{% url 'store:profit' %}"><i class="bi bi-cash-stack"></i> Net Profit</a>
    <a href="{% url 'store:chatbot' %}"><i class="bi bi-robot"></i> Grocery Assistant</a>
    <a href="{% url 'store:expiredcorner' %}"><i class="bi bi-graph-down"></i> Expired Corner</a>
    <a href="{% url 'store:matplotlib_charts' %}">
    <i class="bi bi-bar-chart me-1"></i>Charts
    </a>
    <a href="{% url 'store:daa' %}">
  <i class="bi bi-cpu me-1"></i>Algorithms and analysis
</a>



    <a href="{% url 'store:logout' %}" class="btn-logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
  </div>
</nav>
{% endif %}

<div class="main-content">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
