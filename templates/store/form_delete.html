{% extends 'store/base.html' %}
{% block title %}Delete {{ type }} — FreshMart{% endblock %}
{% block content %}

<div class="d-flex align-items-center gap-3 mb-2">
  <a href="{% url 'store:home' %}" style="color:#6b7c6e;text-decoration:none;font-size:14px;">
    <i class="bi bi-arrow-left"></i> Back
  </a>
</div>

<div class="page-title">Delete {{ type }}</div>
<div class="page-sub">This action cannot be undone</div>

<div class="card p-4" style="max-width:480px;">
  <div style="text-align:center;padding:20px 0;">
    <div style="font-size:52px;margin-bottom:12px;">🗑️</div>
    <h5 style="font-family:'Syne',sans-serif;font-weight:700;margin-bottom:8px;">
      Are you sure?
    </h5>
    <p style="color:#6b7c6e;font-size:14px;margin-bottom:24px;">
      You are about to delete <strong>{{ name }}</strong>.<br>
      This cannot be recovered!
    </p>
    <form method="POST">
      {% csrf_token %}
      <div class="d-flex gap-2 justify-content-center">
        <button type="submit"
                style="background:#e74c3c;color:#fff;border:none;padding:10px 28px;
                       border-radius:8px;font-weight:600;cursor:pointer;">
          <i class="bi bi-trash"></i> Yes, Delete
        </button>
        <a href="{% url 'store:home' %}"
           class="btn btn-outline-secondary">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
